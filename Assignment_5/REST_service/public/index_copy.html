<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <title>Leak Service (JWT + CORS)</title>
</head>
<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
  <h5 class="my-0 mr-md-auto font-weight-normal">Leak Service</h5>
</div>

<div class="container">

  <div class="row mt-4">
    <div class="col-md-8">
      <h3>Register a username</h3>
      <p class="text-muted mb-3">This issues a JWT (HS256) scoped to <code>/store/&lt;username&gt;</code>.</p>

      <div class="form-inline">
        <input type="text" class="form-control mr-sm-2" id="username" placeholder="Username (A-Z 0-9 _ -)">
        <button type="button" id="register" class="btn btn-primary">Register & get JWT</button>
      </div>

      <div class="mt-3">
        <div class="invalid-feedback d-block" id="err" style="display:none;"></div>
        <label class="mt-2"><b>JWT</b></label>
        <textarea class="form-control" id="token" rows="5" readonly></textarea>
        <small class="text-muted">Store this somewhere safe. For the demo XSS payload, you’ll embed it.</small>
      </div>
    </div>
  </div>

  <hr class="my-4"/>

  <div class="row">
    <div class="col-md-8">
      <h4>Quick test (optional)</h4>

      <div class="form-group">
        <label>POST body (JSON or text)</label>
        <textarea class="form-control" id="postBody" rows="4">{ "demo": true, "note": "hello" }</textarea>
      </div>

      <button type="button" id="doPost" class="btn btn-outline-primary mr-2">POST /store/&lt;username&gt;</button>
      <button type="button" id="doGet" class="btn btn-outline-secondary">GET /store/&lt;username&gt;</button>

      <pre class="mt-3" id="out" style="white-space: pre-wrap;"></pre>
    </div>
  </div>

</div>

<script src="js/jquery-3.7.1.slim.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="app.js"></script>

</body>
</html>
