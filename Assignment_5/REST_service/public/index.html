<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <title>REST service</title>
</head>
<body class="text-center">

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
  <h5 class="my-0 mr-md-auto font-weight-normal">REST service</h5>
</div>

<div class="container">

  <div class="row mt-4 justify-content-center">
    <div style="text-align: center;">
      <h3 style="font-family: Arial, sans-serif;">Register a username</h3>

      <div style="margin: auto;">
        <input type="text" style="padding: 6px; width: 200px; border-radius: 6px;" id="username" placeholder="Username">
        <button type="button" id="register" style="padding: 8px 14px; background-color: #007bff; color: white; border: none; border-radius: 6px;">Submit</button>
      </div>

      <div style="margin-top: 20px;">
        <div style="color: red; display:none;" id="err"></div>
        <label style="margin-top: 10px; font-weight: bold;"><b>JWT</b></label>
        <div id="token"></div>
      </div>
    </div>
  </div>

  <!-- REMOVE BELOW -->
  <hr class="my-4"/>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <h4>Quick test (optional)</h4>

      <div class="form-group">
        <label>POST body (JSON or text)</label>
        <textarea class="form-control" id="postBody" rows="4">Hello world!</textarea>
      </div>

      <button type="button" id="doPost" class="btn btn-outline-primary mr-2">POST /store/&lt;username&gt;</button>
      <button type="button" id="doGet" class="btn btn-outline-secondary">GET /store/&lt;username&gt;</button>

      <pre class="mt-3" id="out" style="white-space: pre-wrap;"></pre>
    </div>
  </div>
  <!-- REMOVE ABOVE -->

</div>

<script src="js/jquery-3.7.1.slim.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
